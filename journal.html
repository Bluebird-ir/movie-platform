        <div class="mb-8">
            <div class="flex items-center gap-2">
                <svg class="w-6 h-6 text-golden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

                <h1 class="font-display text-2xl font-bold text-textPrimary">My Journal</h1>
            </div>
            <p class="mt-1 text-sm text-textMuted">Your saved favourite movies.</p>
        </div>

        <div id="journal-grid" class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
        </div>
    </main>

    <footer class="mt-10 border-t border-surfaceBorder bg-surfaceLight/70 backdrop-blur-sm">
        <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div>
                <p class="font-display text-base font-semibold text-golden">CineVault</p>
                <p class="text-sm text-textMuted">A cozy corner for your cinema obsessions, one hearted movie at a time.</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">

                    class="rounded-full border border-surfaceBorder px-4 py-2 text-sm font-medium text-textMuted transition-all duration-200 hover:-translate-y-0.5 hover:border-golden hover:text-golden">

                <a href="https://x.com" target="_blank" rel="noopener noreferrer"
                    class="rounded-full border border-surfaceBorder px-4 py-2 text-sm font-medium text-textMuted transition-all duration-200 hover:-translate-y-0.5 hover:border-golden hover:text-golden">

                    class="text-sm text-textMuted transition-colors hover:text-textPrimary">
